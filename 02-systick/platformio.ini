; 02-systick —— 显式配置 168 MHz + SysTick 1 ms 基准

[env:f407zg]
platform = ststm32
board = vccgnd_f407zg_mini
framework = stm32cube
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    ; 板上晶振是 8 MHz；不声明的话 CMSIS 默认按 25 MHz 算，
    ; 会导致 SystemCoreClock 算错、SysTick 定时跟着错。
    -DHSE_VALUE=8000000U
