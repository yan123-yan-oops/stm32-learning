; 鹿小班 STM32F407ZGT6 核心板 —— PlatformIO 工程
; 板卡 ID 用 vccgnd_f407zg_mini（同款 F407ZGT6，PIO 官方支持 cmsis-dap）
; 打开方式：VS Code → 文件 → 打开文件夹 → 选本目录

[env:f407zg]
platform = ststm32
board = vccgnd_f407zg_mini
framework = stm32cube

; 下载与调试都用 DAPLink
upload_protocol = cmsis-dap
debug_tool = cmsis-dap

; 串口监视器（如果以后用 USB CDC 或外接 USB-TTL）
monitor_speed = 115200

build_flags =
    -Wall
    -Wextra
