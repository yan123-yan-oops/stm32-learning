; 05-freertos —— FreeRTOS 最小移植 + 三任务
; 内核源码已复制到 src/freertos/（来自 PlatformIO 的 stm32cubef4 包，v10.x）

[env:f407zg]
platform = ststm32
board = vccgnd_f407zg_mini
framework = stm32cube
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
monitor_speed = 115200

; 链接阶段补上硬浮点 ABI（见 extra_float_abi.py 注释）
extra_scripts = pre:extra_float_abi.py

build_flags =
    -Wall
    -Wextra
    -DHSE_VALUE=8000000U
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -Isrc/freertos/include
    -Isrc/freertos/portable/GCC/ARM_CM4F
